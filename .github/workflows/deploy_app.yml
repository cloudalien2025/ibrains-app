name: Deploy iBrains App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write release metadata
        run: |
          set -e
          mkdir -p app/_meta
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          GIT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_ENV="production"
          cat > app/_meta/release.json <<EOF
          {
            "service": "ibrains",
            "environment": "${APP_ENV}",
            "git_sha": "${GIT_SHA}",
            "git_sha_short": "${SHORT_SHA}",
            "build_timestamp": "${BUILD_TIMESTAMP}",
            "build_id": "${GITHUB_RUN_ID}",
            "source": "github_actions"
          }
          EOF

      - name: Build Next.js app
        run: npm run build

      - name: Create deployment artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/build.tar.gz \
          .next \
          package.json \
          package-lock.json \
          public \
          next.config.mjs \
          app \
          scripts/prod_smoke.sh \
          scripts/patch_next_route_types.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibrains-build
          path: artifacts/build.tar.gz


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ibrains-build
          path: artifacts

      - name: Copy artifact to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: artifacts/build.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            ARTIFACT_PATH="${DEPLOY_PATH}/artifacts/build.tar.gz"
            STAGING_ROOT="${DEPLOY_PATH}/.deploy_staging"
            RELEASE_DIR="${STAGING_ROOT}/release-${GITHUB_RUN_ID:-manual}-$(date +%s)"

            mkdir -p "${RELEASE_DIR}"
            tar -xzf "${ARTIFACT_PATH}" -C "${RELEASE_DIR}"
            rm -f "${ARTIFACT_PATH}"

            cd "${RELEASE_DIR}"
            npm ci --omit=dev

            SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="ibrains-app"
            fi

            systemctl_cmd=(systemctl)
            if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
              systemctl_cmd=(sudo systemctl)
            fi

            if "${systemctl_cmd[@]}" is-enabled "$SERVICE_NAME" 2>/dev/null | grep -q "^masked$"; then
              echo "Configured service '$SERVICE_NAME' is masked; falling back to 'ibrains-app'."
              SERVICE_NAME="ibrains-app"
            fi

            if "${systemctl_cmd[@]}" is-enabled "$SERVICE_NAME" 2>/dev/null | grep -q "^masked$"; then
              "${systemctl_cmd[@]}" unmask "$SERVICE_NAME"
            fi

            service_started=0
            cleanup_on_error() {
              if [ "$service_started" -eq 0 ]; then
                "${systemctl_cmd[@]}" start "$SERVICE_NAME" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup_on_error EXIT

            "${systemctl_cmd[@]}" stop "$SERVICE_NAME"

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude artifacts \
                --exclude .deploy_staging \
                --exclude .env \
                --exclude .env.production.local \
                "${RELEASE_DIR}/" "${DEPLOY_PATH}/"
            else
              find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 \
                ! -name artifacts \
                ! -name .deploy_staging \
                ! -name .env \
                ! -name .env.production.local \
                -exec rm -rf {} +
              cp -a "${RELEASE_DIR}/." "${DEPLOY_PATH}/"
            fi

            "${systemctl_cmd[@]}" start "$SERVICE_NAME"
            service_started=1
            trap - EXIT

            ready=0
            for attempt in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:3001/api/meta/release; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              echo "release endpoint did not become ready after restart"
              "${systemctl_cmd[@]}" status "$SERVICE_NAME" --no-pager -l || true
              (command -v journalctl >/dev/null 2>&1 && journalctl -u "$SERVICE_NAME" -n 150 --no-pager) || true
              exit 1
            fi

            rm -rf "${STAGING_ROOT}"
            cd "${DEPLOY_PATH}"

            BASE_URL=http://127.0.0.1:3001 \
            HOST_HEADER=app.ibrains.ai \
            PROTO=http \
            DOMAIN=app.ibrains.ai \
            ./scripts/prod_smoke.sh app.ibrains.ai
